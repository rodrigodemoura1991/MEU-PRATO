name: Corrigir Meu Prato — Whey

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir quebras de linha do script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '// WHEY_QUICK_ADD_V1'
          if marker not in s:
              raise SystemExit('Atalho de whey não encontrado')
          s2 = s.replace('\\\n', '\n')
          if s2 == s:
              print('Nenhuma correção necessária.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Quebras de linha corrigidas.')
          PY
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: corrigir script do atalho de whey"
          git push
